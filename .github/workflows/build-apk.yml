name: Build J.A.R.V.I.S. APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify source configuration
        run: |
          test -s app/src/main/java/com/jarvis/assistant/MainActivity.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisOrbView.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisWebActivity.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisCommandRouter.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisLocalBrain.kt
          test -s app/src/main/res/drawable/ic_jarvis_orb.xml
          grep -q 'applicationId = "com.jarvis.assistant"' app/build.gradle.kts
          grep -q 'versionName = "7.0.0"' app/build.gradle.kts
          grep -q 'android:name=".JarvisWebActivity"' app/src/main/AndroidManifest.xml
          grep -q 'HIDDEN_NEURONS = 2678' app/src/main/java/com/jarvis/assistant/JarvisLocalBrain.kt
          ! grep -q 'QUERY_ALL_PACKAGES' app/src/main/AndroidManifest.xml
          ! grep -R -i 'Neural HUD\|neural-hud\|com.neuralhud' app/src/main README.md

      - name: Run local tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK package and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.jarvis.assistant.debug7'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
