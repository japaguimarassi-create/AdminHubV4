name: Build and verify J.A.R.V.I.S. APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JARVIS_GOOGLE_WEB_CLIENT_ID: ${{ vars.JARVIS_GOOGLE_WEB_CLIENT_ID }}
      JARVIS_AUTH_ENDPOINT: https://hgcjnkxpsnrjrofvwrzp.supabase.co/functions/v1/jarvis-auth
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify project source
        run: |
          test -s app/src/main/java/com/jarvis/assistant/LoginActivity.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisAuthRepository.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisCommandInterpreter.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisConversationStore.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisVoiceInteractionSession.kt
          test -s supabase/functions/jarvis-auth/index.ts
          test -s supabase/migrations/20261011000000_jarvis_global_owner.sql
          grep -q 'versionName = "9.0.0"' app/build.gradle.kts
          grep -q 'android:name=".LoginActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".JarvisVoiceInteractionService"' app/src/main/AndroidManifest.xml
          ! grep -q 'QUERY_ALL_PACKAGES' app/src/main/AndroidManifest.xml
          ! grep -R -i 'Neural HUD\\|neural-hud\\|com.neuralhud' app/src/main README.md

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK package and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.jarvis.assistant.debug9'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-v9-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
