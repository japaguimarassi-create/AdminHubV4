name: Build and verify J.A.R.V.I.S. APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JARVIS_GOOGLE_WEB_CLIENT_ID: 188208581214-dtshluh0fkclfq8mnupaf2nn35l1flrc.apps.googleusercontent.com
      JARVIS_AUTH_ENDPOINT: https://hgcjnkxpsnrjrofvwrzp.supabase.co/functions/v1/jarvis-auth
      JARVIS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_u45gasHV_JVFSXYtWMUVMA_Wkb4EnZN
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure persistent signing key
        id: signing
        env:
          JARVIS_DEBUG_SIGNING_BUNDLE_B64: ${{ secrets.JARVIS_DEBUG_SIGNING_BUNDLE_B64 }}
        run: |
          if [ -z "$JARVIS_DEBUG_SIGNING_BUNDLE_B64" ]; then
            echo "JARVIS_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable signing bundle is missing. No APK artifact will be published."
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(base64.b64decode(os.environ["JARVIS_DEBUG_SIGNING_BUNDLE_B64"].strip(), validate=True))
          required = ["alias", "storePassword", "keyPassword", "keystoreBase64"]
          if any(not isinstance(bundle.get(k), str) or not bundle[k] for k in required):
              raise SystemExit("Signing bundle is missing required fields.")
          target = Path(os.environ["RUNNER_TEMP"]) / "jarvis-debug.keystore"
          target.write_bytes(base64.b64decode(bundle["keystoreBase64"], validate=True))
          target.chmod(0o600)
          for password in (bundle["storePassword"], bundle["keyPassword"]):
              print(f"::add-mask::{password}")
          values = {
              "JARVIS_DEBUG_KEYSTORE_PATH": str(target),
              "JARVIS_DEBUG_KEYSTORE_PASSWORD": bundle["storePassword"],
              "JARVIS_DEBUG_KEY_ALIAS": bundle["alias"],
              "JARVIS_DEBUG_KEY_PASSWORD": bundle["keyPassword"],
              "JARVIS_STABLE_SIGNING": "true"
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}" + chr(10))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("stable=true" + chr(10))
          print("Persistent signing configured.")
          PY
      - name: Verify project source
        run: |
          test -s app/src/main/java/com/jarvis/assistant/LoginActivity.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisAuthRepository.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisCommandInterpreter.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisConversationStore.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisVoiceInteractionSession.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisKnowledgeBase.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisInternalSandbox.kt
          test -s app/src/main/assets/jarvis_knowledge.json
          grep -q 'versionName = "15.0.0"' app/build.gradle.kts
          grep -q "SUPABASE_PUBLISHABLE_KEY" app/src/main/java/com/jarvis/assistant/JarvisAuthRepository.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisCredentialErrorClassifier.kt
          grep -q "requestServerNonce" app/src/main/java/com/jarvis/assistant/JarvisAuthRepository.kt
          grep -q "setFilterByAuthorizedAccounts(authorizedOnly)" app/src/main/java/com/jarvis/assistant/JarvisAuthRepository.kt
          test -s app/src/main/java/com/jarvis/assistant/JarvisOAuthDiagnostics.kt
          grep -q "JarvisOAuthDiagnostics.accountReauthGuidance" app/src/main/java/com/jarvis/assistant/JarvisAuthRepository.kt
          grep -q "GetGoogleIdOption.Builder" app/src/main/java/com/jarvis/assistant/JarvisAuthRepository.kt
          test -s supabase/functions/jarvis-auth/index.ts
          test -s supabase/migrations/20261011000000_jarvis_global_owner.sql
          test -s docs/JARVIS_OAUTH_AUTOMATION.md
          grep -q 'versionName = "15.0.0"' app/build.gradle.kts
          grep -q 'android:name=".LoginActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".JarvisVoiceInteractionService"' app/src/main/AndroidManifest.xml
          ! grep -q 'QUERY_ALL_PACKAGES' app/src/main/AndroidManifest.xml
          ! grep -R -i 'com.neuralhud' app/src/main

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and generate OAuth diagnostics
        id: oauth_diag
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          CERT_INFO="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")"
          printf '%s' "$CERT_INFO"
          SHA1="$(printf '%s' "$CERT_INFO" | sed -n 's/.*SHA-1 digest: //p' | head -n 1)"
          SHA256="$(printf '%s' "$CERT_INFO" | sed -n 's/.*SHA-256 digest: //p' | head -n 1)"
          PACKAGE="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          if [ "$JARVIS_STABLE_SIGNING" = "true" ]; then EXPECTED_PACKAGE="com.jarvis.assistant.debug"; else EXPECTED_PACKAGE="com.jarvis.assistant.debug"; fi
          test "$PACKAGE" = "$EXPECTED_PACKAGE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          PROBE_BODY="$RUNNER_TEMP/jarvis-auth-probe.json"
          PROBE_CODE="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output "$PROBE_BODY" --write-out '%{http_code}' -X POST "$JARVIS_AUTH_ENDPOINT" -H "apikey: $JARVIS_SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{"action":"nonce"}')"
          if [ "$PROBE_CODE" = "200" ] && python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); sys.exit(0 if x.get("ok") is True and isinstance(x.get("nonce"),str) and len(x["nonce"]) >= 32 else 1)' "$PROBE_BODY"; then BACKEND_STATUS="Reachable; server-issued nonce flow succeeded."; else BACKEND_STATUS="Nonce probe failed (HTTP $PROBE_CODE); inspect Supabase function configuration."; fi
          REPORT="$RUNNER_TEMP/jarvis-oauth-diagnostics.md"
          {
            echo "# J.A.R.V.I.S. 15.0.0 — OAuth diagnostics"
            echo
            echo "- Package: \`$PACKAGE\`"
            echo "- Signing SHA-1: \`$SHA1\`"
            echo "- Signing SHA-256: \`$SHA256\`"
            echo "- Web Client ID: \`$JARVIS_GOOGLE_WEB_CLIENT_ID\`"
            echo "- Supabase probe: $BACKEND_STATUS"
            echo "- Stable signing: \`$JARVIS_STABLE_SIGNING\`"
            echo
            if [ "$JARVIS_STABLE_SIGNING" = "true" ]; then
              echo "Register this exact package and SHA-1 as an Android OAuth client in the same Google Cloud project as the Web client."
            else
              echo "**Intermediate CI signature only.** This artifact is re-signed with the stable private key before delivery.
              echo "- Intended package: \`com.jarvis.assistant.debug\`"
              echo "- Intended stable signing SHA-1: \`5B:2E:28:1B:18:5E:4E:FA:50:0F:C7:18:89:5D:1B:7F:B0:71:20:38\`"
              echo "Configure \`JARVIS_DEBUG_SIGNING_BUNDLE_B64\` once to make future CI artifacts use the stable signing key."
            fi
            echo
            echo "The CI report does not prove a real sign-in; test on-device after OAuth registration."
          } > "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK
        if: steps.signing.outputs.stable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-v15-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload intermediate APK for stable re-signing
        if: steps.signing.outputs.stable != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-v15-intermediate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload OAuth diagnostics
        if: steps.oauth_diag.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-oauth-diagnostics
          path: ${{ steps.oauth_diag.outputs.report }}
          if-no-files-found: error
          retention-days: 14
